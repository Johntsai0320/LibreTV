services:
  - type: web
    name: libretv
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/status
    envVars:
      - key: PORT
        value: "8080"
      - key: PASSWORD
        sync: false
      - key: PROXY_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: REQUEST_TIMEOUT
        value: "8000"
      - key: MAX_RETRIES
        value: "1"
